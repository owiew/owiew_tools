name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, testes, build, a11y e Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Auditoria das dependências de produção (high/critical travam)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck (tsc no core, astro check no site)
        run: npm run typecheck
      - name: Testes do core com cobertura mínima de 80%
        run: npm run test:coverage
      - name: Valida o registro de ferramentas
        run: npm run check:tools
      - name: Build (gera OG, páginas e sitemap)
        run: npm run build
      - name: Varredura de emoji (código e HTML gerado)
        run: npm run check:emoji
      - name: Links do sitemap, canonical e hreflang
        run: npm run check:sitemap
      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: e2e e axe (WCAG 2.2 AA) em 360px e desktop
        run: npm run test:e2e
      - name: Lighthouse CI com budget (LCP, CLS, TBT em mobile)
        run: npm run lhci
      - name: Guarda os relatórios do Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: apps/site/.lighthouseci
          if-no-files-found: ignore

  gitleaks:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instala o gitleaks com checksum verificado
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Procura segredos em todo o histórico
        run: ./gitleaks detect --source . --redact --verbose
